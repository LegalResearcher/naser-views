name: Naser Views Standalone
run-name: Naser Views standalone (${{ github.run_id }})
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naser-views
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Xvfb
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run standalone processing
        env:
          SITE_USERNAME_1: ${{ secrets.SITE_USERNAME_1 }}
          SITE_PASSWORD_1: ${{ secrets.SITE_PASSWORD_1 }}
          SITE_USERNAME_2: ${{ secrets.SITE_USERNAME_2 }}
          SITE_PASSWORD_2: ${{ secrets.SITE_PASSWORD_2 }}
          SITE_USERNAME_3: ${{ secrets.SITE_USERNAME_3 }}
          SITE_PASSWORD_3: ${{ secrets.SITE_PASSWORD_3 }}
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" python main.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update state from standalone run"
          git pull --rebase origin main
          git push origin HEAD:main
