name: Naser Views - Manual Link Retry

on:
  workflow_dispatch:
    inputs:
      link:
        description: "رابط منشور محدد لإعادة تشغيله (100 مشاهدة مدفوعة)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: naser-views
  cancel-in-progress: false

jobs:
  retry-one-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependency
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Retry selected link
        env:
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TARGET_LINK: ${{ inputs.link }}
        run: python retry_link.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update state after manual retry"
          git pull --rebase
          git push
